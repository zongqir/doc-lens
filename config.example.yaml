# ==============================================================================
# DocLens 服务全局配置文件示例 (Configuration Template)
# 使用说明：
# 1. 复制本文件为 config.yaml: cp config.example.yaml config.yaml
# 2. 根据实际需求修改监听端口、鉴权密码和挂载知识库路径
# 3. 运行 ./doc-lens 即可启动服务
# ==============================================================================

# 服务网络监听配置
port: 18086
host: "0.0.0.0"

# 鉴权与安全会话配置
auth:
  # 首次启动时的初始登录密码。启动后系统会自动将其转换为强加密哈希 (bcrypt)
  initial_password: "admin888"
  
  # 会话签名密钥 (留空时系统会在首次启动时自动生成 32 字节高熵随机密钥)
  session_secret: ""
  
  # 登录 Session Cookie 有效期（单位：天），支持超长免密保持
  session_days: 180

# 知识库 / 文档目录挂载列表 (支持挂载多个本地目录)
repositories:
  - id: docs
    name: "技术知识库 (Docs)"
    # 本地 Markdown/代码仓库的绝对路径或相对于二进制的相对路径
    path: "./docs"
    # Web 访问路由前缀 (如 /docs/xxx)
    route_prefix: "/docs"
    description: "团队内部核心技术架构与实战文档"
    # 是否允许前端调用 AI 任务或保存修改 (true/false)
    writable: true
    # 忽略扫描的子目录（可选）
    ignore_dirs:
      - ".git"
      - "node_modules"
      - ".idea"

# 后台异步 AI 写作与解剖引擎配置
# 详细协议规范与接入指引请查阅 docs/AI_RUNNER_SPEC.md
ai:
  # 是否开启 AI 辅助写作与深度解剖能力（默认关闭 false）
  #
  # 【设计哲学与官方强烈建议】：
  # 1. 纯净知识库模式（默认）：保持 enabled: false。此时 DocLens 呈现为 100% 自包含、
  #    零外部依赖的极简知识库（包含架构图、思维导图与听书等全量能力），绝无任何报错入口。
  # 2. 为什么不推荐在服务端写死/直连 LLM API？
  #    简单的聊天 API 无法感知仓库规范 (AGENTS.md)、目录层级与动态 Skill 技能，极难生成高质量工程沉淀。
  #    因此 DocLens 坚持解耦的外部 CLI Runner 架构——强烈建议外挂自主 Agent CLI（如 agy, claude, aider 等）
  #    或能够读写工作区文件的外部脚本，让真正的智能体去理解你的知识库。
  # 3. 如需开启：设为 true，并指定外部执行器 runner_cmd；也可通过环境变量 DOCLENS_AI_ENABLED=true 动态开启。
  enabled: false

  # 外部 AI 命令行调用执行器 (需在系统 PATH 中，或填写脚本绝对路径)
  # 协议契约：DocLens 执行 `<runner_cmd> -p "<prompt>"`，并在标准输出捕获流式日志
  # 
  # 示例 1 (官方推荐)：接入系统已有的自主编程 Agent CLI (如 agy, claude, aider 等，能深入感知 AGENTS.md 规范)
  # runner_cmd: "agy"
  # 
  # 示例 2：使用自带的零依赖 Python 脚本 (兼容 DeepSeek / OpenAI / 智谱 / Kimi)
  #   只需预先在环境设置 export OPENAI_API_KEY="sk-..."
  runner_cmd: "python3 scripts/ai_runner_example.py"
  
  # 示例 3：使用本地离线 Ollama 大模型
  # runner_cmd: "bash scripts/ai_runner_ollama.sh"

  # 最大并发排队任务数
  max_queue: 10

  # 网络代理注入 (可选，为 AI Runner 子进程自动注入 http_proxy / https_proxy)
  proxy:
    enabled: false
    http: "http://127.0.0.1:7890"
    https: "http://127.0.0.1:7890"
    all: "socks5://127.0.0.1:7891"

# 任务日志、分享记录与持久化状态存储目录
# 默认存储在用户目录: ~/.local/state/doc-lens
state_dir: ""
