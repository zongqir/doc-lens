<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="glintGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#0f172a" flood-opacity="0.28" />
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#lensGrad)" />
  <rect x="2" y="2" width="60" height="30" rx="16" fill="url(#glintGrad)" />
  <rect x="2" y="2" width="60" height="60" rx="16" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />

  <!-- Modern Technical Doc icon -->
  <g filter="url(#softShadow)" stroke="#ffffff" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Document outline with precision fold -->
    <path d="M37.5 13H21a4 4 0 0 0-4 4v30a4 4 0 0 0 4 4h22a4 4 0 0 0 4-4V22.5L37.5 13z" stroke-width="3.5" />
    <polyline points="37 13 37 23 47 23" stroke-width="3.5" />
    <!-- Formatted document lines -->
    <line x1="25" y1="23" x2="31" y2="23" stroke-width="3.2" />
    <line x1="25" y1="32" x2="39" y2="32" stroke-width="3.2" />
    <line x1="25" y1="40" x2="34" y2="40" stroke-width="3.2" />
  </g>
</svg>