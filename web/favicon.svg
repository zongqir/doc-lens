<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="glintGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#0f172a" flood-opacity="0.28" />
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#lensGrad)" />
  <rect x="2" y="2" width="60" height="30" rx="16" fill="url(#glintGrad)" />
  <rect x="2" y="2" width="60" height="60" rx="16" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />

  <!-- Lens & reticle icon -->
  <g filter="url(#softShadow)">
    <!-- Outer magnifying lens ring -->
    <circle cx="28" cy="28" r="14" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" />
    <!-- Lens handle -->
    <line x1="38.5" y1="38.5" x2="50.5" y2="50.5" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
    <!-- Reticle / Target crosshair inside lens -->
    <line x1="28" y1="20" x2="28" y2="36" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.9" />
    <line x1="20" y1="28" x2="36" y2="28" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.9" />
    <!-- Center focal point -->
    <circle cx="28" cy="28" r="2.2" fill="#ffffff" />
  </g>
</svg>