services:
  doc-lens:
    image: ghcr.io/zongqir/doc-lens:latest
    # Or build locally:
    # build: .
    container_name: doc-lens
    restart: unless-stopped
    ports:
      - "18086:18086"
    volumes:
      # Mode 1 (Recommended): Single unified data volume (contains config.yaml, docs/, state/)
      - ./data:/data
      # Mode 2 (Optional): Directly mount your existing markdown notes folder to /docs
      # - /path/to/your/markdown/notes:/docs
    environment:
      - TZ=Asia/Shanghai
      # Optional: Override initial password or custom port via ENV
      # - DOCLENS_INITIAL_PASSWORD=admin888
      # - DOCLENS_PORT=18086
